name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build WalkBreakSoftReminder.slnx --configuration Release

      - name: Check
        run: dotnet run --project WalkBreakSoftReminder.Checks --configuration Release --no-build

      - name: Publish a self-contained Windows x64 executable
        run: >-
          dotnet publish WalkBreakSoftReminder --configuration Release --runtime win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          --output publish/single-file

      - name: Verify single-file output
        run: |
          $files = @(Get-ChildItem publish/single-file -File -Force)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'WalkBreakSoftReminder.exe') {
            throw 'Expected exactly one published file: WalkBreakSoftReminder.exe'
          }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "build-$env:GITHUB_RUN_NUMBER"
          publish/single-file/WalkBreakSoftReminder.exe
          --target "$env:GITHUB_SHA"
          --title "Build $env:GITHUB_RUN_NUMBER"
          --generate-notes
